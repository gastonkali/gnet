<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gnet - Conectando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #07090e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .logo { font-size: 3rem; font-weight: 800; color: #6366f1; margin-bottom: 12px; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1f293d;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .desc { font-size: 1.1rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="logo">Gnet</div>
  <div class="spinner"></div>
  <div class="desc">Conectando con tu servidor multimedia...</div>
  <script>
    const gistRaw = 'https://gist.githubusercontent.com/gastonkali/132ca02d6625e3b35428daa2e2029c7a/raw/?t=' + Date.now();
    fetch(gistRaw)
      .then(res => res.json())
      .then(data => {
        if (data && data.url) {
          window.location.replace(data.url);
        } else {
          document.querySelector('.desc').innerText = 'Servidor fuera de línea temporalmente.';
        }
      })
      .catch(err => {
        console.error(err);
        document.querySelector('.desc').innerText = 'Reintentando conexión...';
        setTimeout(() => location.reload(), 3000);
      });
  </script>
</body>
</html>
